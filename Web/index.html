<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SMARTGUARD — Dashboard</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--tx:#14202b;--mut:#5d6b78;--bd:#dde3e9;--ok:#1a8f4c;--okbg:#e3f5ea;--al:#d6342c;--albg:#fde8e6;--wr:#b36b00;--wrbg:#fff1d9;--ac:#1b6fd1;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f161d;--card:#18222c;--tx:#e8eef3;--mut:#93a3b1;--bd:#2a3844;--ok:#4cc982;--okbg:#14301f;--al:#ff6b62;--albg:#3a1815;--wr:#f0b04a;--wrbg:#3a2a0e;--ac:#5aa3f5}}
:root[data-theme="dark"]{--bg:#0f161d;--card:#18222c;--tx:#e8eef3;--mut:#93a3b1;--bd:#2a3844;--ok:#4cc982;--okbg:#14301f;--al:#ff6b62;--albg:#3a1815;--wr:#f0b04a;--wrbg:#3a2a0e;--ac:#5aa3f5}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45}
.wrap{max-width:960px;margin:0 auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
h1{font-size:20px;margin:0}h1 small{display:block;font-size:12px;font-weight:400;color:var(--mut)}
.pill{font-size:12px;padding:3px 10px;border-radius:99px;border:1px solid var(--bd);color:var(--mut)}
.banner{border-radius:12px;padding:16px;display:flex;align-items:center;gap:14px;margin-bottom:14px;border:1px solid var(--bd)}
.banner .dot{width:14px;height:14px;border-radius:50%;flex:none}
.banner b{font-size:18px;display:block}.banner span{font-size:13px;color:var(--mut)}
.s-ok{background:var(--okbg)}.s-ok .dot{background:var(--ok)}
.s-al{background:var(--albg);border-color:var(--al)}.s-al .dot{background:var(--al);animation:p 1s infinite}
.s-wr{background:var(--wrbg)}.s-wr .dot{background:var(--wr)}
@keyframes p{50%{opacity:.3}}
.grid{display:grid;grid-template-columns:1.2fr 1fr;gap:14px}
@media(max-width:720px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;min-width:0}
.card h2{font-size:13px;margin:0 0 10px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
svg{width:100%;height:auto;display:block;border-radius:8px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{border:1px solid var(--bd);border-radius:10px;padding:10px}
.stat small{color:var(--mut);font-size:12px}.stat b{display:block;font-size:17px}
.bar{height:6px;background:var(--bd);border-radius:4px;margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok);transition:width .3s}
.events{list-style:none;margin:0;padding:0;max-height:260px;overflow-y:auto}
.events li{padding:8px 0;border-bottom:1px solid var(--bd);font-size:13px;display:flex;gap:8px}
.events li:last-child{border:0}
.tag{font-size:11px;padding:1px 7px;border-radius:99px;flex:none;height:fit-content}
.t-high{background:var(--albg);color:var(--al)}.t-medium{background:var(--wrbg);color:var(--wr)}.t-info{background:var(--okbg);color:var(--ok)}
.events time{color:var(--mut);display:block;font-size:11px}
.ctl{display:flex;flex-wrap:wrap;gap:8px}
button{font:inherit;font-size:13px;padding:8px 12px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer}
button:hover{border-color:var(--ac)}
.note{font-size:12px;color:var(--mut);margin-top:10px}
button.ack{font-size:11px;padding:2px 8px;margin-top:4px}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>SMARTGUARD<small>Smart Anti-Theft GPS Vehicle Tracker · sg-device-001</small></h1>
  <span class="pill" id="live">Menghubungkan…</span>
</header>

<div id="banner" class="banner s-wr"><i class="dot"></i><div><b id="bTitle">Memuat…</b><span id="bSub">—</span></div></div>

<div class="grid">
  <div class="card">
    <h2>Lokasi &amp; Geofence</h2>
    <svg viewBox="0 0 400 300" id="map" role="img" aria-label="Peta geofence">
      <rect width="400" height="300" fill="var(--bg)"/>
      <g stroke="var(--bd)" stroke-width="1"><path d="M0 75H400M0 150H400M0 225H400M100 0V300M200 0V300M300 0V300"/></g>
      <circle cx="200" cy="150" r="105" fill="var(--ac)" fill-opacity=".08" stroke="var(--ac)" stroke-dasharray="5 4"/>
      <circle cx="200" cy="150" r="5" fill="var(--ac)"/>
      <text x="210" y="145" font-size="11" fill="var(--mut)">HOME</text>
      <text id="radTxt" x="200" y="38" font-size="11" fill="var(--mut)" text-anchor="middle">radius —</text>
      <line id="mLine" x1="200" y1="150" x2="200" y2="150" stroke="var(--mut)" stroke-dasharray="3 3"/>
      <circle id="mCar" cx="200" cy="150" r="9" fill="var(--mut)" stroke="#fff" stroke-width="2"/>
    </svg>
    <div class="note" id="locTxt">—</div>
  </div>

  <div class="card">
    <h2>Status Perangkat</h2>
    <div class="stats">
      <div class="stat"><small>Baterai</small><b id="bat">—</b><div class="bar"><i id="batBar"></i></div></div>
      <div class="stat"><small>Jarak dari HOME</small><b id="dist">—</b></div>
      <div class="stat"><small>GPS</small><b id="gps">—</b></div>
      <div class="stat"><small>Gerakan</small><b id="mot">—</b></div>
      <div class="stat"><small>Mode daya</small><b id="pwr">—</b></div>
      <div class="stat"><small>Jaringan</small><b id="net">—</b></div>
    </div>
    <div class="note" id="seen">—</div>
  </div>

  <div class="card" style="grid-column:1/-1">
    <h2>Riwayat Event</h2>
    <ul class="events" id="events"></ul>
  </div>
</div>
</div>

<script>
var DEV = 'sg-device-001', API = '/api/v1/devices/' + DEV, POLL_MS = 5000;
var $ = function(id){ return document.getElementById(id); };
var REASON = {motion_detected:'gerakan terdeteksi', geofence_exceeded:'keluar geofence'};
var LABEL = {security_alarm:'Alarm keamanan', battery_low:'Baterai rendah', battery_critical:'Baterai kritis',
  device_started:'Perangkat menyala', sensor_fault:'Sensor bermasalah',
  connectivity_restored:'Koneksi pulih', event_queue_overflow:'Antrean event penuh'};

function fmt(s){ return s ? new Date(s).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit',second:'2-digit'}) : '—'; }
function fmtDT(s){ return new Date(s).toLocaleString('id-ID',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}); }
function ago(sec){ return sec < 60 ? sec + ' detik' : sec < 3600 ? Math.round(sec/60) + ' menit' : Math.round(sec/3600) + ' jam'; }
function num(v, d){ return (v === null || v === undefined) ? '—' : Number(v).toFixed(d); }

function api(path, opt){
  return fetch(API + path, opt).then(function(r){
    return r.json().then(function(j){ if(!j.ok) throw new Error(j.error || r.status); return j.data; });
  });
}
function load(){
  Promise.all([api('/status'), api('/events?limit=20')])
    .then(function(r){ $('live').textContent = 'Live · ' + fmt(new Date().toISOString()); render(r[0], r[1].items); })
    .catch(function(e){ $('live').textContent = 'Server tidak terjangkau'; setBanner('s-wr','Tidak bisa menghubungi server','Dashboard tidak bisa memastikan status kendaraan. ' + e.message); });
}
function setBanner(cls, t, s){ $('banner').className = 'banner ' + cls; $('bTitle').textContent = t; $('bSub').textContent = s; }

function render(st, items){
  var rep = st.report || {}, sec = rep.security || {}, gps = rep.gps || {}, bt = rep.battery || {},
      mo = rep.motion || {}, pw = rep.power || {}, cn = rep.connectivity || {};
  var unacked = items.filter(function(e){ return e.severity === 'high' && !e.acknowledged_at; }).length;
  var low = bt.soc_percent !== null && bt.soc_percent !== undefined && bt.soc_percent < 20;
  var radius = sec.geofence_radius_m || 30;

  if(st.connection === 'never') setBanner('s-wr','Belum ada data dari perangkat','Menunggu laporan pertama dari ESP32.');
  else if(st.connection === 'offline') setBanner('s-wr','OFFLINE — status terbaru belum tersedia',
    'Status terakhir: ' + (sec.alarm_active ? 'ALARM' : (sec.state || '—')) + ' · ' + ago(st.age_seconds) + ' lalu. Jangan dianggap aman.');
  else if(sec.alarm_active) setBanner('s-al','ALARM — gerakan mencurigakan','Jarak dari HOME ' + num(sec.distance_from_home_m,1) + ' m · laporan ' + fmt(st.last_seen_at));
  else if(low || unacked) setBanner('s-wr', (sec.state || 'ARMED') + ' — perlu perhatian',
    (low ? 'Baterai rendah. ' : '') + (unacked ? unacked + ' event penting belum diakui.' : ''));
  else setBanner('s-ok', (sec.state || 'ARMED') + ' — kendaraan terpantau', 'Online — laporan terakhir ' + fmt(st.last_seen_at));

  $('bat').textContent = bt.soc_percent == null ? '—' : bt.soc_percent + '%  (' + num(bt.voltage_v,2) + ' V)';
  $('batBar').style.width = (bt.soc_percent || 0) + '%';
  $('batBar').style.background = low ? 'var(--al)' : 'var(--ok)';
  $('dist').textContent = sec.distance_from_home_m == null ? '—' : num(sec.distance_from_home_m,1) + ' m';
  $('gps').textContent = gps.fix ? 'Fix · ' + (gps.satellites == null ? '?' : gps.satellites) + ' satelit' : 'Belum fix';
  $('mot').textContent = mo.available === false ? 'Sensor tidak tersedia' : (mo.detected ? 'Terdeteksi' : (mo.detected === false ? 'Diam' : '—'));
  $('pwr').textContent = pw.mode || '—';
  $('net').textContent = st.connection === 'offline' ? 'Offline' : (cn.wifi_connected ? 'Wi-Fi · API OK' : '—');
  $('seen').textContent = st.last_seen_at ? 'Laporan terakhir ' + fmt(st.last_seen_at) + ' (' + ago(st.age_seconds) + ' lalu)' : 'Belum ada laporan';

  // peta: posisi relatif terhadap HOME
  $('radTxt').textContent = 'radius ' + radius + ' m';
  var car = $('mCar'), line = $('mLine'), home = sec.home;
  if(gps.fix && gps.latitude != null && gps.longitude != null && home){
    var dx = (gps.longitude - home.longitude) * 111320 * Math.cos(home.latitude * Math.PI/180);
    var dy = (gps.latitude - home.latitude) * 110540;
    var k = 105 / radius, px = dx * k, py = -dy * k, len = Math.sqrt(px*px + py*py);
    if(len > 190){ px *= 190/len; py *= 190/len; }
    car.setAttribute('cx', 200 + px); car.setAttribute('cy', 150 + py);
    line.setAttribute('x2', 200 + px); line.setAttribute('y2', 150 + py);
    car.setAttribute('fill', st.connection !== 'online' ? 'var(--wr)' : (sec.alarm_active ? 'var(--al)' : 'var(--ok)'));
    $('locTxt').textContent = 'Posisi: ' + gps.latitude + ', ' + gps.longitude + ' · jarak ' + num(Math.sqrt(dx*dx+dy*dy),1) + ' m dari HOME';
  } else {
    car.setAttribute('cx', 200); car.setAttribute('cy', 150); line.setAttribute('x2', 200); line.setAttribute('y2', 150);
    car.setAttribute('fill', 'var(--mut)');
    $('locTxt').textContent = 'GPS belum fix — posisi terakhir yang valid tidak tersedia.';
  }

  var ul = $('events'); ul.innerHTML = '';
  if(!items.length){ var e0 = document.createElement('li'); e0.textContent = 'Belum ada event.'; ul.appendChild(e0); }
  items.forEach(function(ev){
    var li = document.createElement('li');
    var tg = document.createElement('span'); tg.className = 'tag t-' + ev.severity; tg.textContent = ev.event_type;
    var d = document.createElement('div');
    var txt = LABEL[ev.event_type] || ev.event_type;
    var rs = (ev.reason || []).map(function(r){ return REASON[r] || r; }).join(' + ');
    if(rs) txt += ': ' + rs;
    if(ev.distance_from_home_m != null) txt += ' (' + num(ev.distance_from_home_m,1) + ' m dari HOME)';
    d.appendChild(document.createTextNode(txt));
    var tm = document.createElement('time');
    tm.textContent = fmtDT(ev.occurred_at) + (ev.acknowledged_at ? ' · diakui ' + fmt(ev.acknowledged_at) : '');
    d.appendChild(tm);
    if(!ev.acknowledged_at){
      var b = document.createElement('button'); b.className = 'ack'; b.textContent = 'Akui';
      b.onclick = function(){ api('/events/' + encodeURIComponent(ev.event_id) + '/acknowledge', {method:'POST'}).then(load); };
      d.appendChild(b);
    }
    li.appendChild(tg); li.appendChild(d); ul.appendChild(li);
  });
}

load();
setInterval(load, POLL_MS);
</script>
</body>
</html>
