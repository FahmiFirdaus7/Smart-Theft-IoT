<!doctype html>
<html lang="id" class="h-full">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SMARTGUARD</title>
<meta name="theme-color" content="#F4F6FB">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%232F6BFF'/%3E%3Cpath d='M50 18l28 10v22c0 18-12 28-28 33-16-5-28-15-28-33V28z' fill='white'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Figtree:wght@400..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body data-tone="stale" class="h-full bg-paper font-sans text-ink antialiased">
<main class="relative h-dvh overflow-hidden">
  <div id="map" class="absolute inset-0 isolate z-0"></div>

  <div id="demo" hidden class="absolute inset-x-0 top-0 z-30 bg-ink py-1 text-center text-xs text-white">Mode demo: data contoh, bukan dari perangkat sungguhan.</div>

  <header class="absolute left-3 right-3 top-4 z-20 lg:left-4 lg:right-auto lg:w-[400px]">
    <div class="glass flex items-center gap-2 rounded-2xl p-2 pl-3">
      <div class="grid h-9 w-9 place-items-center rounded-xl bg-brand text-white"><i data-lucide="shield-check" class="h-5 w-5"></i></div>
      <div class="min-w-0 flex-1">
        <p class="font-display text-[15px] font-bold leading-tight">SMARTGUARD</p>
        <select id="device" class="w-full truncate bg-transparent text-xs text-ink/60" aria-label="Pilih perangkat"></select>
      </div>
      <button id="btn-push" class="ibtn !shadow-none" aria-label="Aktifkan notifikasi di perangkat ini"><i data-lucide="bell-ring" class="h-5 w-5"></i></button>
    </div>
  </header>

  <div class="absolute right-3 top-24 z-20 flex flex-col gap-2 lg:right-4 lg:top-4">
    <button id="btn-car" class="ibtn" aria-label="Pusatkan ke kendaraan"><i data-lucide="locate-fixed" class="h-5 w-5"></i></button>
    <button id="btn-fit" class="ibtn" aria-label="Tampilkan kendaraan dan titik awal"><i data-lucide="scan" class="h-5 w-5"></i></button>
    <button id="btn-sat" class="ibtn" aria-label="Ganti tampilan peta"><i data-lucide="layers" class="h-5 w-5"></i></button>
    <button id="btn-in" class="ibtn hidden lg:grid" aria-label="Perbesar"><i data-lucide="plus" class="h-5 w-5"></i></button>
    <button id="btn-out" class="ibtn hidden lg:grid" aria-label="Perkecil"><i data-lucide="minus" class="h-5 w-5"></i></button>
  </div>

  <aside class="glass absolute inset-x-0 bottom-0 z-20 flex max-h-[52dvh] flex-col rounded-t-[28px] lg:inset-x-auto lg:bottom-4 lg:left-4 lg:top-[84px] lg:max-h-none lg:w-[400px] lg:rounded-3xl">
    <div class="mx-auto mt-2 h-1.5 w-10 shrink-0 rounded-full bg-ink/20 lg:hidden"></div>
    <div class="flex-1 space-y-4 overflow-y-auto overscroll-contain px-4 pb-[max(1rem,env(safe-area-inset-bottom))] pt-3">
      <div id="notice"></div>
      <section id="hero"></section>
      <section id="tiles" class="grid grid-cols-2 gap-3"></section>
      <section id="health" class="flex flex-wrap gap-2"></section>
      <section>
        <div class="flex items-center justify-between">
          <h2 class="font-display text-lg font-bold">Riwayat kejadian</h2>
          <div class="flex rounded-lg bg-ink/5 p-0.5 text-xs font-semibold" id="filter">
            <button data-f="all" class="rounded-md px-3 py-1" aria-pressed="true">Semua</button>
            <button data-f="alarm" class="rounded-md px-3 py-1" aria-pressed="false">Alarm</button>
          </div>
        </div>
        <ul id="events" class="mt-2 space-y-2"></ul>
        <button id="more" hidden class="mt-2 w-full rounded-xl bg-ink/5 py-2 text-sm font-semibold">Muat lebih banyak</button>
      </section>
    </div>
  </aside>

  <dialog id="login" class="m-auto w-[min(92vw,360px)] rounded-3xl p-5 backdrop:bg-ink/50">
    <h2 class="font-display text-xl font-bold">Masuk</h2>
    <p id="login-msg" class="mt-1 text-sm text-ink/70">Masukkan token akun untuk melihat perangkat Anda.</p>
    <form id="login-form" class="mt-4 space-y-3">
      <input id="token" type="password" autocomplete="current-password" placeholder="Token akun" class="w-full rounded-xl border border-ink/15 px-3 py-2.5">
      <button class="w-full rounded-xl bg-brand py-2.5 font-semibold text-white">Masuk</button>
    </form>
  </dialog>

  <div id="toast" role="status" aria-live="polite" hidden class="fixed bottom-24 left-1/2 z-40 -translate-x-1/2 rounded-full bg-ink px-4 py-2 text-sm text-white lg:bottom-6"></div>
</main>

<script src="config.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
